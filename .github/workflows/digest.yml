# День 18: 24/7 периодический дайджест (погода + новости), раз в 6 часов.
# Тот же studio/collector.py, что MCP-сервер news_weather; результат
# коммитится в data/digests/ (message bus): agent читает через
# get_latest_digest (локально или GitHub API).
name: digest-24x7

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build digest
        run: python studio/collector.py --out data/digests

      - name: Verify digest
        run: |
          python -c "import json; d = json.load(open('data/digests/last-digest.json', encoding='utf-8')); assert d.get('id') and d.get('generated_at') and d.get('weather') is not None and d.get('news'), 'bad digest: ' + str(d)[:200]"

      - name: Commit digests
        run: |
          git config user.name "ai-advent-bot"
          git config user.email "ai-advent-bot@users.noreply.github.com"
          git add data/digests/last-digest.json data/digests/history.json
          if git diff --cached --quiet; then
            echo "no digest changes"
          else
            git commit -m "chore(digest): auto-digest $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin HEAD:master
          fi
